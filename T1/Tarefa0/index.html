<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <title>Ventana simple</title>

</head>

<body>
  <button type="button" class="btn btn-success btn-lg m-5" data-bs-toggle="modal" data-bs-target="#Modal">Abrir
    ventana</button>
  <div class="modal" id="Modal">
    <div class="modal-dialog draggable">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Ventana</h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">HOLA BOAS QUE TAL</div>
      </div>
    </div>
  </div>
  <script>
    // Hacer el modal arrastrable usando la cabecera
    $('.modal-dialog').draggable({
      handle: '.modal-header'
    });
  </script>
</body>

</html>
