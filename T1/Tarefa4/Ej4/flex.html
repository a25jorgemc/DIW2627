<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flex</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0 auto;
      }
      #principal {
        border: 2px dotted black;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #naranja {
        padding: 1rem;
        background-color: #ff7f50;
        height: calc(50% - 0.5rem);
        margin-bottom: 1rem;
        width: 100%;
      }
      #azul {
        padding: 1rem;
        width: 100%;
        height: calc(50% - 0.5rem);
        background-color: #6495ed;
      }
    </style>
  </head>
  <body>
    <div id="principal">
      <div id="naranja"></div>
      <div id="azul"></div>
    </div>
  </body>
</html>
