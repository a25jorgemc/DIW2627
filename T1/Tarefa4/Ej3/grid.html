<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grid</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0 auto;
      }
      #principal {
        display: grid;
        height: 100vh;
        border: 1px solid black;
        padding: 1rem;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
      #esquerda {
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 0.5rem;
      }
      #dereita {
        display: grid;
        grid-template-rows: 0.5fr 1fr;
        gap: 0.5rem;
      }
      #verde {
        background-color: green;
        padding: 1rem;
      }
      #rojo {
        background-color: red;
        padding: 1rem;
      }
      #azul {
        background-color: blue;
        padding: 1rem;
      }
      #morado {
        background-color: blueviolet;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="principal">
      <div id="esquerda">
        <div id="verde"></div>
        <div id="rojo"></div>
      </div>
      <div id="dereita">
        <div id="azul"></div>
        <div id="morado"></div>
      </div>
    </div>
  </body>
</html>
