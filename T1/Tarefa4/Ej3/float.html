<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>float</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0 auto;
      }

      .clearfix::after {
        content: '';
        display: table;
        clear: both;
      }

      #principal {
        border: 1px solid black;
        height: 100vh;
        padding: 1rem;
      }

      #esquerda {
        width: calc(50% - 0.125rem);
        height: 100%;
        float: left;
        margin-right: 0.25rem;
        margin-top: 0.25rem;
      }
      #dereita {
        width: calc(50% - 0.125rem);
        height: 100%;
        float: right;
        margin-top: 0.25rem;
      }
      #verde {
        background-color: green;
        padding: 1rem;
        float: left;
        width: calc(100% - 5px);
        height: calc(50% - 0.5rem);
        margin-bottom: 0.5rem;
      }

      #rojo {
        background-color: red;
        padding: 1rem;
        float: left;
        width: calc(100% - 5px);
        height: calc(50% - 0.5rem);
      }

      #azul {
        background-color: blue;
        padding: 1rem;
        float: left;
        width: calc(100% - 2px);
        height: calc(30% - 0.5rem);
        margin-bottom: 0.5rem;
      }

      #morado {
        background-color: blueviolet;
        padding: 1rem;
        float: left;
        width: calc(100% - 2px);
        height: calc(70% - 0.5rem);
      }
    </style>
  </head>
  <body>
    <div id="principal">
      <div id="esquerda">
        <div id="verde"></div>
        <div id="rojo"></div>
      </div>
      <div id="dereita">
        <div id="azul"></div>
        <div id="morado"></div>
      </div>
    </div>
  </body>
</html>
