<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grid</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0 auto;
      }

      #principal {
        border: 1px dotted red;
        padding: 1rem;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      #amarillo {
        height: 100%;
        background-color: #f0e68c;
        border: 1px solid green;
      }

      #azul {
        height: 100%;
        background-color: #e0ffff;
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <div id="principal">
      <div id="amarillo"></div>
      <div id="azul"></div>
    </div>
  </body>
</html>
