<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estructura real</title>
    <style>
      * {
        box-sizing: border-box;
        color: white;
      }
      body {
        margin: 0 auto;
        background-color: white;
        height: 100vh;
      }
      #cabeceira {
        padding: 1rem;
        background-color: #cd5c5c;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(10% - 1rem);
      }
      #principal {
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        gap: 1rem;
        height: 80%;
      }
      #navegacion {
        background-color: #cd5c5c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #seccion {
        background-color: #cd5c5c;
        text-align: center;
        display: grid;
        grid-template-rows: 1fr 1fr 4fr 2fr;
        gap: 1rem;
      }
      #tituloSection {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
        margin: 0;
      }
      #dereita {
        background-color: #cd5c5c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #cabeceiraSection {
        background-color: #bdb76b;
        margin-left: 1rem;
        margin-right: 1rem;
      }
      #artigoSection {
        background-color: #bdb76b;
        margin-left: 1rem;
        margin-right: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #footerSection {
        background-color: #bdb76b;
        margin-left: 1rem;
        margin-right: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
      }
      #footerPrincipal {
        background-color: #cd5c5c;
        padding: 1rem;
        margin-top: 1rem;
        height: calc(10% - 1rem);
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <header id="cabeceira"><h2>&ltheader&gt</h2></header>
    <div id="principal">
      <nav id="navegacion"><h2>&ltnav&gt</h2></nav>
      <section id="seccion">
        <h2 id="tituloSection">&ltsection&gt</h2>
        <header id="cabeceiraSection">
          <h2>&ltheader&gt</h2>
        </header>
        <article id="artigoSection">
          <h2>&ltarticle&gt</h2>
        </article>
        <footer id="footerSection">
          <h2>&ltfooter&gt</h2>
        </footer>
      </section>
      <aside id="dereita"><h2>&ltaside&gt</h2></aside>
    </div>
    <footer id="footerPrincipal">
      <h2>&ltfooter&gt</h2>
    </footer>
  </body>
</html>
