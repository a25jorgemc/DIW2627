<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      min-height: 100vh;
    }

    form {
      display: flex;
      gap: 0.5rem;
    }

    select,
    button {
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
    }

    button {
      background-color: #4f46e5;
      color: white;
      border: none;
    }

    iframe {
      width: 90%;
      height: 70vh;
      background-color: white;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>Selecciona a actividade que queres ver: </h1>
  <form>
    <select name="selectActividades" id="idActis">
      <option value="act1.html">Act 1</option>
      <option value="act3.html">Act 2</option>
      <option value="act3.html">Act 3</option>
      <option value="act4.html">Act 4</option>
      <option value="act5.html">Act 5</option>
      <option value="act6.html">Act 6</option>
      <option value="act7.html">Act 7</option>
      <option value="act8.html">Act 8</option>
      <option value="act9.html">Act 9</option>
      <option value="act10.html">Act 10</option>
    </select>
    <button type="button" id="btnCargar">Ver</button>
  </form>
  <iframe id="pantalla"></iframe>
  <script defer>
    const desplegable = document.getElementById("idActis");
    const boton = document.getElementById("btnCargar");
    const marco = document.getElementById("pantalla");

    boton.addEventListener("click", function () {
      marco.src = desplegable.value;
    })
  </script>

</body>

</html>
