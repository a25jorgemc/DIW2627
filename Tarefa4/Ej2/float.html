<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cousillo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0 auto;
        }

        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }

        #principal {
            margin: 1rem;
            border: 1px dotted red;
            padding: 1rem;
            height: 100vh;
        }



        #amarillo {
            width: 50%;
            height: 100%;
            background-color: #f0e68c;
            float: left;
            border: 1px solid green;
            padding: 1rem;
        }

        #azul {
            width: 50%;
            height: 100%;
            background-color: #e0ffff;
            float: right;
            border: 1px solid red;
            padding: 1rem;

        }
    </style>
</head>

<body>
    <div id="principal">
        <div id="amarillo"></div>
        <div id="azul"></div>
    </div>
</body>

</html>
