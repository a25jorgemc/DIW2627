<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francia</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0 auto;
        }

        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }

        div {
            height: 100vh;
        }

        #azulillo {
            width: 33.33%;
            background: blue;
            float: left;
        }

        #blanco {
            width: 33.33%;
            background: white;
            float: left;
        }

        #rojillo {
            width: 33.33%;
            background: red;
            float: left;
        }
    </style>
</head>

<body>
    <div id="principal">
        <div id="azulillo"></div>
        <div id="blanco"></div>
        <div id="rojillo"></div>
    </div>
</body>

</html>
