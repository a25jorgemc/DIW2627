<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francilla</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            margin: 0 auto;
        }

        div {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            width: 100%;
        }

        #principal {
            border: 1px dotted black;
        }

        #azulillo {
            background-color: blue;
        }

        #blanco {
            background-color: white;
        }

        #rojillo {
            background-color: red;
        }
    </style>
</head>


<body>
    <div id="principal">
        <div id="azulillo"></div>
        <div id="blanco"></div>
        <div id="rojillo"></div>
    </div>
</body>

</html>
