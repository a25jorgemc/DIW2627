<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francilla</title>
    <style>
        body {
            margin: 0 auto;
        }

        div {
            height: 100vh;
        }

        #principal {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            border: 1px dotted black;
        }

        #azulillo {
            background-color: blue;
        }

        #blanco {
            background-color: white;
        }

        #rojillo {
            background-color: red;
        }
    </style>
</head>


<body>
    <div id="principal">
        <div id="azulillo"></div>
        <div id="blanco"></div>
        <div id="rojillo"></div>
    </div>
</body>

</html>
