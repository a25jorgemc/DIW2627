<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Float</title>
    <style>
      * {
        box-sizing: border-box;
        gap: 1rem;
      }

      body {
        margin: 0 auto;
      }
      .clearfix::after {
        content: '';
        display: table;
        clear: both;
      }
      #principal {
        height: 100vh;
        display: grid;
        grid-template-columns: 2fr 1fr;
      }
      #esquerda {
        display: grid;
        grid-template-rows: 1fr 1fr;
      }
      #abaixoEsquerda {
        display: grid;
        grid-template-columns: 1fr 2fr;
      }
      #esquerdisima {
        display: grid;
        grid-template-rows: 1fr 3fr;
      }
      #dereita {
        display: grid;
        grid-template-rows: 2fr 4fr 1fr;
      }
      #verdeClaro {
        background-color: #4ceba9;
        height: 100%;
        padding: 1rem;
      }
      #rojo {
        background-color: red;
        height: 100%;
        padding: 1rem;
      }
      #naranja {
        background-color: #ff6d00;
        padding: 1rem;
        height: 100%;
      }
      #magenta {
        background-color: magenta;
        padding: 1rem;
      }
      #verdeOscuro {
        background-color: green;
        padding: 1rem;
      }
      #azul {
        background-color: #01509f;
        padding: 1rem;
      }
      #ocre {
        background-color: #ca9e61;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="principal">
      <div id="esquerda">
        <div id="verdeClaro"></div>
        <div id="abaixoEsquerda">
          <div id="esquerdisima">
            <div id="rojo"></div>
            <div id="naranja"></div>
          </div>
          <div id="magenta"></div>
        </div>
      </div>
      <div id="dereita">
        <div id="verdeOscuro"></div>
        <div id="azul"></div>
        <div id="ocre"></div>
      </div>
    </div>
  </body>
</html>
